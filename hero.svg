<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Sudipta Biswas — Full-Stack Developer and BCA (AI &amp; ML) student</title>
  <desc id="d">Dark glass window banner with the name Sudipta Biswas and the tagline Learn, build, debug, improve.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070d"/>
      <stop offset="0.6" stop-color="#0b1426"/>
      <stop offset="1" stop-color="#120f2a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glowC" cx="0.15" cy="0.2" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowV" cx="0.9" cy="0.9" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#glowC)"/>
  <rect width="1200" height="400" fill="url(#glowV)"/>

  <!-- window -->
  <rect x="80" y="50" width="1040" height="300" rx="18" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.14"/>
  <line x1="80" y1="96" x2="1120" y2="96" stroke="#ffffff" stroke-opacity="0.1"/>
  <circle cx="112" cy="73" r="7" fill="#ff5f57"/>
  <circle cx="136" cy="73" r="7" fill="#febc2e"/>
  <circle cx="160" cy="73" r="7" fill="#28c840"/>
  <text x="600" y="78" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#94a3b8">sudipta629 — ~/portfolio</text>

  <!-- content -->
  <text x="130" y="170" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#22d3ee">$ whoami</text>
  <text x="130" y="238" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="66" font-weight="700" fill="#f1f5f9" letter-spacing="-1">Sudipta Biswas</text>
  <rect x="132" y="256" width="150" height="4" rx="2" fill="url(#accent)"/>
  <text x="130" y="298" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#cbd5e1">Full-Stack Developer · BCA (AI &amp; ML) student</text>
  <text x="130" y="328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#7dd3fc">Learn. Build. Debug. Improve.</text>

  <!-- code panel -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">
    <rect x="800" y="130" width="280" height="190" rx="12" fill="#05070d" fill-opacity="0.55" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="824" y="166" fill="#a78bfa">class</text><text x="872" y="166" fill="#f1f5f9"> Developer:</text>
    <text x="840" y="196" fill="#7dd3fc">name</text><text x="888" y="196" fill="#94a3b8"> = </text><text x="912" y="196" fill="#a5f3fc">"Sudipta"</text>
    <text x="840" y="226" fill="#7dd3fc">stack</text><text x="896" y="226" fill="#94a3b8"> = </text><text x="920" y="226" fill="#a5f3fc">"Python"</text>
    <text x="840" y="256" fill="#7dd3fc">learning</text><text x="920" y="256" fill="#94a3b8"> = </text><text x="944" y="256" fill="#a5f3fc">"DSA"</text>
    <text x="840" y="286" fill="#7dd3fc">status</text><text x="904" y="286" fill="#94a3b8"> = </text><text x="928" y="286" fill="#a5f3fc">"building"</text>
